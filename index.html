<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THORNE PRO - Master Suite</title>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        :root { --navy: #0D1B2A; --gold: #D4AF37; --cream: #E0E1DD; --bg: #F0F2F5; --white: #FFFFFF; --danger: #8B0000; --success: #2D6A4F; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--navy); margin: 0; padding-bottom: 80px; }
        .header { background: var(--navy); padding: 20px; text-align: center; border-bottom: 4px solid var(--gold); }
        .header h1 { color: var(--gold); margin: 0; font-size: 1.2rem; letter-spacing: 3px; text-transform: uppercase; }
        nav { display: flex; background: var(--navy); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(212,175,55,0.2); }
        nav button { flex: 1; padding: 15px; border: none; background: none; color: var(--cream); font-weight: bold; font-size: 0.7rem; border-bottom: 3px solid transparent; }
        nav button.active { border-bottom: 3px solid var(--gold); color: var(--gold); }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .page { display: none; }
        .page.active { display: block; }
        
        .card { background: var(--white); border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 4px solid var(--gold); overflow: hidden; transition: all 0.2s ease; }
        summary { padding: 15px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        .card-inner { padding: 15px; border-top: 1px solid #eee; background: #fafafa; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; box-sizing: border-box; }
        .btn-main { width: 100%; background: var(--navy); color: var(--gold); padding: 16px; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; cursor: pointer; margin-bottom: 10px; }
        .btn-rec { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; margin-bottom: 10px; font-weight: bold; cursor: pointer; }
        .btn-file { background: #f8f8f8; border: 1px dashed #ccc; padding: 10px; text-align: center; display: block; border-radius: 5px; font-size: 0.8rem; margin-bottom: 10px; cursor: pointer; }
        .btn-delete { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 8px; border-radius: 5px; font-size: 0.7rem; width: 100%; margin-top: 15px; font-weight: bold; cursor: pointer; }

        .media-prev { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .media-prev * { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid var(--gold); background: #000; }
        .hist-media { width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; margin-top: 10px; background: #000; display: block; }
        audio { width: 100%; height: 35px; margin-top: 5px; display: block; }
        
        .drill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 15px; }
        .drill-chip { border: 2px solid var(--navy); padding: 10px; border-radius: 6px; text-align: center; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .drill-chip.active { background: var(--navy); color: var(--gold); }
        
        .stars { display: flex; gap: 8px; color: #ccc; font-size: 2rem; cursor: pointer; margin: 5px 0 15px 0; }
        .star.filled { color: var(--gold); }
        .summary-stars { color: var(--gold); font-size: 0.9rem; pointer-events: none; }
    </style>
</head>
<body>

<div class="header"><h1>THORNE Master Log</h1></div>

<nav>
    <button id="nav-log" class="active" onclick="showPage('log')">Log</button>
    <button id="nav-plan" onclick="showPage('plan')">Objectives</button>
    <button id="nav-hist" onclick="showPage('hist')">History</button>
</nav>

<div class="container">
    <div id="page-log" class="page active">
        <div class="card"><div class="card-inner">
            <label>Date</label><input type="date" id="log-date">
            <label>Link Objective</label><select id="log-obj-link"></select>
            <label>Location</label><select id="log-env"><option>Home</option><option>Garden</option><option>Club</option><option>Public</option></select>
        </div></div>

        <details class="card"><summary>Select Drills</summary>
            <div class="drill-grid" id="drill-selector"></div>
            <div style="padding: 10px;"><input type="text" id="custom-drill-name" placeholder="Drill name..."><button class="btn-main" style="padding:10px;" onclick="addCustomDrill()">+ Add Drill</button></div>
        </details>
        
        <div id="active-drills-area"></div>
        
        <div class="card"><div class="card-inner">
            <label>Session Summary</label><textarea id="log-summary" rows="3"></textarea>
            <label class="btn-file">📷 Upload Session Media<input type="file" accept="image/*,video/*" multiple onchange="captureMedia(this, 'general')" style="display:none"></label>
            <div id="prev-general" class="media-prev"></div>
            <button class="btn-rec" id="rec-general" onclick="captureVoice('general')">🎤 Session Voice Note</button>
            <div id="audio-general"></div>
        </div></div>
        
        <button class="btn-main" id="btn-save-session" onclick="saveSession()">Confirm & Save</button>
    </div>

    <div id="page-plan" class="page">
        <button class="btn-main" onclick="expandAll()">Expand/Collapse All</button>
        <div id="objective-list"></div>
        <hr style="border:0; border-top:2px dashed var(--navy); margin:25px 0;">
        <details class="card"><summary>+ Add New Objective Set</summary>
            <div class="card-inner">
                <input type="text" id="new-obj-title" placeholder="Objective Name">
                <textarea id="new-obj-desc" placeholder="Details..."></textarea>
                <button class="btn-main" onclick="addNewSet()">Create New Set</button>
            </div>
        </details>
    </div>

    <div id="page-hist" class="page"><div id="history-container"></div></div>
</div>

<script>
    const db = new Dexie("ThorneProDB");
    db.version(18).stores({ 
        logs: '++id, date, obj', 
        plan: '++id, title, isFoundational, rating, lastRevised' 
    });

    let activeRecorders = {}, tempAudios = {}, tempMedia = {};

    async function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        if(id === 'plan') renderObjectives();
        if(id === 'log') updateDropdown();
        if(id === 'hist') renderHistory();
    }

    // --- MEDIA ---
    function captureMedia(input, key) {
        const files = Array.from(input.files);
        if(!tempMedia[key]) tempMedia[key] = [];
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                tempMedia[key].push({ type: file.type, data: e.target.result });
                const tag = file.type.startsWith('video') ? 'video' : 'img';
                const container = document.getElementById('prev-' + key);
                if (container) container.innerHTML += `<${tag} src="${e.target.result}" ${tag==='video'?'muted':''}></${tag}>`;
            };
            reader.readAsDataURL(file);
        });
    }

    async function captureVoice(key) {
        const btn = document.getElementById('rec-' + key);
        if (!activeRecorders[key]) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const recorder = new MediaRecorder(stream);
            let chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const reader = new FileReader();
                reader.readAsDataURL(new Blob(chunks, { type: 'audio/mp4' }));
                reader.onloadend = async () => {
                    const base64 = reader.result;
                    if (!tempAudios[key]) tempAudios[key] = [];
                    tempAudios[key].push(base64);
                    const audioContainer = document.getElementById('audio-' + key);
                    if (audioContainer) audioContainer.innerHTML += `<audio controls src="${base64}"></audio>`;
                };
            };
            recorder.start(); activeRecorders[key] = recorder;
            btn.innerText = "🛑 STOP";
        } else {
            activeRecorders[key].stop(); delete activeRecorders[key];
            btn.innerText = "🎤 RECORD";
        }
    }

    // --- OBJECTIVES (WITH STAR FIX) ---
    async function renderObjectives() {
        let plans = await db.plan.toArray();
        if (plans.length === 0) {
            const titles = ["1. Rear-End Awareness", "2. Position Changes", "3. Engagement", "4. Heeling", "5. About-Turn", "6. Stay", "7. Calmness", "8. Ball Work"];
            await db.plan.bulkAdd(titles.map(t => ({ title: t, isFoundational: 1, rating: 0, notes: '', lastRevised: 'Template' })));
            plans = await db.plan.toArray();
        }

        const container = document.getElementById('objective-list');
        container.innerHTML = plans.map((p) => `
            <details class="card" data-id="${p.id}">
                <summary>
                    <span>${p.title}</span>
                    <span class="summary-stars">${'★'.repeat(p.rating || 0)}</span>
                </summary>
                <div class="card-inner">
                    <label>Current Mastery Rating</label>
                    <div class="stars">${[1,2,3,4,5].map(v => `
                        <span class="star ${v <= (p.rating || 0) ? 'filled' : ''}" 
                        onclick="setRating(${p.id}, ${v}, event)">★</span>`).join('')}
                    </div>
                    <textarea class="obj-notes" placeholder="Notes...">${p.notes || ''}</textarea>
                    <button class="btn-main" style="background:var(--success); color:white; height:40px; padding:0;" onclick="saveObj(${p.id})">Save Progress</button>
                    <div style="font-size:0.7rem; color:#888;">Last Revised: ${p.lastRevised || 'New'}</div>
                    <button class="btn-delete" onclick="deleteEntry('plan', ${p.id})">Delete Objective</button>
                </div>
            </details>`).join('');
    }

    // STOP PROPAGATION HERE: This prevents the card from closing
    async function setRating(id, val, e) { 
        e.preventDefault(); 
        e.stopPropagation(); 
        await db.plan.update(id, { rating: val }); 
        renderObjectives(); 
        // Force card to stay open
        setTimeout(() => {
            const card = document.querySelector(`details[data-id="${id}"]`);
            if (card) card.open = true;
        }, 10);
    }

    async function saveObj(id) {
        const card = document.querySelector(`[data-id="${id}"]`);
        await db.plan.update(id, { 
            notes: card.querySelector('.obj-notes').value, 
            lastRevised: new Date().toLocaleDateString() 
        });
        alert("Thorne's progress updated.");
        renderObjectives();
    }

    function expandAll() { document.querySelectorAll('#objective-list details').forEach(d => d.open = !d.open); }

    async function addNewSet() {
        const t = document.getElementById('new-obj-title').value;
        if(!t) return;
        await db.plan.add({ title: t, isFoundational: 0, rating: 0, notes: '', lastRevised: 'New' });
        document.getElementById('new-obj-title').value = ''; renderObjectives();
    }

    // --- LOGGING & HISTORY ---
    let drillList = ["Rear-Aware", "Sit", "Stand", "Down", "Heeling", "Stay"];
    function renderDrillSelector() {
        document.getElementById('drill-selector').innerHTML = drillList.map(d => `<div class="drill-chip" id="chip-${d.replace(/\s/g,'')}" onclick="toggleDrill('${d}')">${d}</div>`).join('');
    }
    function toggleDrill(name) {
        const id = name.replace(/\s/g,'');
        const chip = document.getElementById('chip-'+id);
        if(document.getElementById('card-'+id)) { document.getElementById('card-'+id).remove(); chip.classList.remove('active'); }
        else {
            chip.classList.add('active');
            const div = document.createElement('div'); div.className = 'card'; div.id = 'card-'+id;
            div.innerHTML = `<div class="card-inner"><strong>${name}</strong>
                <input type="number" class="d-score" placeholder="Score 0-10"><textarea class="d-notes" placeholder="Notes..."></textarea>
                <label class="btn-file">📷 Drill Media<input type="file" multiple onchange="captureMedia(this, '${id}')" style="display:none"></label>
                <div id="prev-${id}" class="media-prev"></div>
                <button class="btn-rec" id="rec-${id}" onclick="captureVoice('${id}')">🎤 Drill Voice</button>
                <div id="audio-${id}"></div></div>`;
            document.getElementById('active-drills-area').appendChild(div);
        }
    }

    async function saveSession() {
        const drillResults = [];
        document.querySelectorAll('#active-drills-area .card').forEach(c => {
            const name = c.querySelector('strong').innerText;
            const id = name.replace(/\s/g,'');
            drillResults.push({ name, score: c.querySelector('.d-score').value, notes: c.querySelector('.d-notes').value, media: tempMedia[id] || [], audios: tempAudios[id] || [] });
        });
        await db.logs.add({
            date: document.getElementById('log-date').value,
            obj: document.getElementById('log-obj-link').value || "General",
            env: document.getElementById('log-env').value,
            summary: document.getElementById('log-summary').value,
            media: tempMedia['general'] || [],
            audios: tempAudios['general'] || [],
            drills: drillResults
        });
        location.reload();
    }

    async function renderHistory() {
        const logs = await db.logs.orderBy('date').reverse().toArray();
        document.getElementById('history-container').innerHTML = logs.map(l => `
            <details class="card">
                <summary><strong>${l.date}</strong> - ${l.obj}</summary>
                <div class="card-inner">
                    <p>${l.summary}</p>
                    ${(l.media || []).map(m => m.type.startsWith('video') ? `<video class="hist-media" controls src="${m.data}"></video>` : `<img class="hist-media" src="${m.data}">`).join('')}
                    ${(l.audios || []).map(a => `<audio controls src="${a}"></audio>`).join('')}
                    <hr>
                    ${l.drills.map(d => `<div style="background:#eee; padding:10px; border-radius:5px; margin-bottom:10px;">
                        <strong>${d.name}: ${d.score}/10</strong><br>${d.notes}
                        ${(d.media || []).map(m => m.type.startsWith('video') ? `<video class="hist-media" controls src="${m.data}"></video>` : `<img class="hist-media" src="${m.data}">`).join('')}
                        ${(d.audios || []).map(a => `<audio controls src="${a}"></audio>`).join('')}
                    </div>`).join('')}
                    <button class="btn-delete" onclick="deleteEntry('logs', ${l.id})">DELETE PERMANENTLY</button>
                </div>
            </details>`).join('');
    }

    async function updateDropdown() {
        const plans = await db.plan.toArray();
        document.getElementById('log-obj-link').innerHTML = '<option value="">Independent Session</option>' + plans.map(p => `<option value="${p.title}">${p.title}</option>`).join('');
    }

    async function deleteEntry(table, id) { if(confirm("Permanently delete?")) { await db[table].delete(id); table === 'logs' ? renderHistory() : renderObjectives(); } }

    document.getElementById('log-date').valueAsDate = new Date();
    renderDrillSelector();
    showPage('log');
</script>
</body>
</html>
