<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THORNE PRO - Master Suite</title>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        :root { --navy: #0D1B2A; --gold: #D4AF37; --bg: #F0F2F5; --white: #FFFFFF; --danger: #8B0000; --success: #2D6A4F; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; }
        .header { background: var(--navy); padding: 15px; text-align: center; border-bottom: 4px solid var(--gold); }
        .header h1 { color: var(--gold); margin: 0; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        nav { display: flex; background: var(--navy); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(212,175,55,0.2); overflow-x: auto; }
        nav button { flex: 1; min-width: 70px; padding: 12px 5px; border: none; background: none; color: #E0E1DD; font-weight: bold; font-size: 0.65rem; border-bottom: 3px solid transparent; text-transform: uppercase; }
        nav button.active { border-bottom: 3px solid var(--gold); color: var(--gold); }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: var(--white); border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; padding: 15px; }
        .btn-main { width: 100%; background: var(--navy); color: var(--gold); padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-rec { background: var(--danger); color: white; padding: 12px; border-radius: 8px; border: none; width: 100%; margin: 10px 0; font-weight: bold; }
        .stars { font-size: 1.6rem; color: #ccc; cursor: pointer; display: flex; gap: 5px; }
        .stars .filled { color: var(--gold); }
        .media-row { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; }
        .media-row img, .media-row video { width: 120px; height: 120px; object-fit: cover; border-radius: 4px; border: 1px solid var(--gold); flex-shrink: 0; background: #000; }
        .hist-summary { padding: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .hist-details { padding: 15px; border-top: 1px solid #eee; background: #fafafa; display: none; }
        label { font-size: 0.7rem; text-transform: uppercase; font-weight: bold; color: #666; display: block; margin: 12px 0 5px; }
        textarea, input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="header"><h1>THORNE Master Suite</h1></div>

<nav>
    <button id="nav-dash" class="active" onclick="showPage('dash')">Dash</button>
    <button id="nav-log" onclick="showPage('log')">Session</button>
    <button id="nav-plan" onclick="showPage('plan')">Plans</button>
    <button id="nav-hist" onclick="showPage('hist')">History</button>
</nav>

<div class="container">
    <div id="page-dash" class="page active">
        <div class="card" id="dash-stats">Loading...</div>
        <button class="btn-main" onclick="showPage('log')">Start Training</button>
    </div>

    <div id="page-log" class="page">
        <div id="session-init-view" style="text-align:center; padding: 40px 0;">
            <button class="btn-main" onclick="startNewSession()">+ Start New Session</button>
        </div>
        <div id="session-active-card" style="display: none;" class="card">
            <label>Session Details</label>
            <input type="date" id="log-date">
            <select id="log-plan-link" onchange="updateObjectiveDropdown()" style="margin-top:10px;"></select>
            <select id="log-obj-link" style="margin-top:10px;"></select>
            
            <label>Session Rating</label>
            <div class="stars" id="session-stars"></div>
            
            <label>Notes</label><textarea id="log-summary" rows="3"></textarea>
            
            <label>Add Video/Photo</label>
            <input type="file" id="media-input" accept="image/*,video/*" onchange="handleMediaUpload(this)">
            <div class="media-row" id="session-media-prev"></div>
            
            <label>Voice Note</label>
            <button class="btn-rec" id="rec-btn" onclick="toggleVoice()">🎤 Start Recording</button>
            <div id="session-audio-prev"></div>
            
            <button class="btn-main" style="background:var(--success); color:white; margin-top:20px;" onclick="saveFullSession()">Save Session</button>
        </div>
    </div>

    <div id="page-plan" class="page">
        <div id="plans-container"></div>
        <div class="card"><input type="text" id="new-plan-name" placeholder="Plan Name"><button class="btn-main" onclick="addPlan()">Add Plan</button></div>
    </div>

    <div id="page-hist" class="page">
        <div id="history-list"></div>
    </div>
</div>

<script>
    const db = new Dexie("ThorneCoreDB");
    db.version(2).stores({ 
        plans: '++id, name', 
        objectives: '++id, planId, title, rating', 
        logs: '++id, date, planId, objId' 
    });

    let currentRating = 0, sessionMedia = [], sessionAudios = [], recorder, chunks = [];

    async function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        if(id === 'dash') renderDash();
        if(id === 'plan') renderPlans();
        if(id === 'hist') renderHistory();
    }

    // --- MEDIA HANDLING (BLOB BASED) ---
    function handleMediaUpload(input) {
        const file = input.files[0];
        if(!file) return;
        // Store the raw file/blob directly for better mobile support
        sessionMedia.push(file); 
        renderMediaPreviews();
    }

    function renderMediaPreviews() {
        const container = document.getElementById('session-media-prev');
        container.innerHTML = '';
        sessionMedia.forEach(file => {
            const url = URL.createObjectURL(file);
            const el = file.type.startsWith('video') 
                ? `<video src="${url}" muted playsinline></video>` 
                : `<img src="${url}">`;
            container.innerHTML += el;
        });
    }

    // --- VOICE LOGIC ---
    async function toggleVoice() {
        const btn = document.getElementById('rec-btn');
        if (!recorder) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            recorder = new MediaRecorder(stream);
            chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                sessionAudios.push(new Blob(chunks, { type: 'audio/ogg; codecs=opus' }));
                renderAudioPreviews();
            };
            recorder.start();
            btn.innerText = "🛑 Stop Recording";
        } else {
            recorder.stop(); recorder = null;
            btn.innerText = "🎤 Start Recording";
        }
    }

    function renderAudioPreviews() {
        const container = document.getElementById('session-audio-prev');
        container.innerHTML = sessionAudios.map(blob => `<audio src="${URL.createObjectURL(blob)}" controls style="width:100%; margin-top:5px;"></audio>`).join('');
    }

    // --- SESSION LOGIC ---
    function startNewSession() {
        document.getElementById('session-init-view').style.display='none';
        document.getElementById('session-active-card').style.display='block';
        sessionMedia = []; sessionAudios = []; currentRating = 0;
        renderStars(); updatePlanDropdown();
    }

    async function saveFullSession() {
        const pId = parseInt(document.getElementById('log-plan-link').value);
        const oId = parseInt(document.getElementById('log-obj-link').value);
        if(!pId || !oId) return alert("Pick a Plan and Objective");

        await db.logs.add({
            date: document.getElementById('log-date').value,
            planId: pId, objId: oId,
            rating: currentRating,
            summary: document.getElementById('log-summary').value,
            media: sessionMedia, // Dexie saves Blobs perfectly
            audios: sessionAudios
        });
        showPage('hist');
        document.getElementById('session-init-view').style.display='block';
        document.getElementById('session-active-card').style.display='none';
    }

    // --- HISTORY RENDERING ---
    async function renderHistory() {
        const logs = await db.logs.orderBy('date').reverse().toArray();
        const container = document.getElementById('history-list');
        container.innerHTML = '';
        for(let l of logs) {
            const plan = await db.plans.get(l.planId);
            const obj = await db.objectives.get(l.objId);
            const div = document.createElement('div');
            div.className = 'card'; div.style.padding = '0';
            
            const mediaHtml = (l.media || []).map(file => {
                const url = URL.createObjectURL(file);
                return file.type.startsWith('video') 
                    ? `<video src="${url}" controls playsinline style="width:100%; margin-top:10px;"></video>` 
                    : `<img src="${url}" style="width:100px; height:100px; margin:5px; object-fit:cover;">`;
            }).join('');

            const audioHtml = (l.audios || []).map(blob => `<audio src="${URL.createObjectURL(blob)}" controls style="width:100%; margin-top:10px;"></audio>`).join('');

            div.innerHTML = `
                <div class="hist-summary" onclick="toggle('h-${l.id}')">
                    <span><b>${l.date}</b><br>${plan?.name} > ${obj?.title}</span>
                    <span style="color:var(--gold);">${'★'.repeat(l.rating)}</span>
                </div>
                <div id="h-${l.id}" class="hist-details">
                    <p>${l.summary}</p>
                    <div style="display:flex; flex-wrap:wrap;">${mediaHtml}</div>
                    ${audioHtml}
                    <button style="color:red; border:none; background:none; margin-top:10px;" onclick="delLog(${l.id})">Delete</button>
                </div>`;
            container.appendChild(div);
        }
    }

    // --- HELPERS ---
    function renderStars() {
        document.getElementById('session-stars').innerHTML = [1,2,3,4,5].map(v => `<span onclick="setRate(${v})" class="${v <= currentRating ? 'filled' : ''}">${v <= currentRating ? '★' : '☆'}</span>`).join('');
    }
    function setRate(v) { currentRating = (currentRating === v) ? 0 : v; renderStars(); }
    function toggle(id) { const e = document.getElementById(id); e.style.display = e.style.display==='block' ? 'none' : 'block'; }
    async function delLog(id) { if(confirm("Delete?")) { await db.logs.delete(id); renderHistory(); } }
    async function updatePlanDropdown() { const p = await db.plans.toArray(); document.getElementById('log-plan-link').innerHTML = '<option value="">Select Plan</option>' + p.map(x => `<option value="${x.id}">${x.name}</option>`).join(''); }
    async function updateObjectiveDropdown() { const pId = parseInt(document.getElementById('log-plan-link').value); const o = await db.objectives.where('planId').equals(pId).toArray(); document.getElementById('log-obj-link').innerHTML = o.map(x => `<option value="${x.id}">${x.title}</option>`).join(''); }
    async function addPlan() { const n = document.getElementById('new-plan-name').value; if(n) { await db.plans.add({name: n}); renderPlans(); } }
    async function renderPlans() {
        const plans = await db.plans.toArray();
        const container = document.getElementById('plans-container'); container.innerHTML = '';
        for(let p of plans) {
            const objs = await db.objectives.where('planId').equals(p.id).toArray();
            container.innerHTML += `<div class="card"><b>${p.name}</b><hr>${objs.map(o => `<div>${o.title}</div>`).join('')}<input id="no-${p.id}"><button onclick="addObj(${p.id})">Add Objective</button></div>`;
        }
    }
    async function addObj(pId) { const t = document.getElementById(`no-${pId}`).value; await db.objectives.add({planId: pId, title: t, rating: 0}); renderPlans(); }
    async function renderDash() { const logs = await db.logs.toArray(); document.getElementById('dash-stats').innerHTML = `Total Sessions: ${logs.length}`; }

    showPage('dash');
</script>
</body>
</html>
